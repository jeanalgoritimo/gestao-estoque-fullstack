<section class="panel">
  <div class="panel-heading">
    <div>
      <h2>Usuários cadastrados</h2>
      <p>Somente administradores podem cadastrar usuários e alterar seus perfis.</p>
    </div>
  </div>
  <div class="category-list">
    @for (u of usuarios(); track u.id) {
      <div class="category-row">
        <div>
          <strong>{{ u.nome }}</strong
          ><small>{{ u.email }} · {{ u.ativo ? 'Ativo' : 'Inativo' }}</small>
        </div>
        <div>
          @if (u.id !== usuarioAtualId()) {
            <select
              class="user-profile"
              [ngModel]="u.perfilId"
              (ngModelChange)="alterarPerfil.emit({ usuario: u, perfilId: $event })"
              aria-label="Perfil de {{ u.nome }}"
            >
              @for (p of perfis(); track p.id) {
                @if (p.ativo) {
                  <option [ngValue]="p.id">{{ p.nome }}</option>
                }
              }</select
            ><button class="secondary" type="button" (click)="alternarAtivo.emit(u)">
              {{ u.ativo ? 'Desativar' : 'Ativar' }}
            </button>
          } @else {
            <span class="badge">{{ u.perfil }}</span>
          }
        </div>
      </div>
    } @empty {
      <p class="empty">Nenhum usuário encontrado.</p>
    }
  </div>
</section>
